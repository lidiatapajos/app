<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Admistrativo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="adm.css">
  <script src="adm.js" defer></script>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <img src="img/escola.png" alt="Logo da Escola" class="logo-img">
    </div>
    <button class="logout-btn" onclick="logout()">Sair</button>
  </header>

  <main class="container">
    <section class="acoes-gerais">
      <button onclick="adicionarUsuario()">
        <i class="fas fa-user-plus"></i> Adicionar Usuário
      </button>
    </section>

    <h1>Usuários e Boletos</h1>
    <div id="usuarios-boletos" class="usuarios-lista"></div>
  </main>
</body>
</html>
