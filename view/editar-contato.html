<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Contato</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="icon" href="public/img/icon-512.png" type="image/png" />
    <link rel="manifest" href="manifest.json" />
    <style>
      :root {
        --vermelho: #c62828;
        --vermelho-claro: #e53935;
        --cinza-bg: #f9f9f9;
        --texto: #333;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: var(--cinza-bg);
        color: var(--texto);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        max-width: 420px;
        width: 100%;
        position: relative;
      }
      .campo {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 16px;
      }

      label {
        font-weight: 500;
        color: #333;
        margin-left: 4px;
      }

      .voltar-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        text-decoration: none;
        color: var(--vermelho);
        font-size: 1.2rem;
        transition: color 0.2s;
      }

      .voltar-btn:hover {
        color: var(--vermelho-claro);
      }

      h1 {
        text-align: center;
        color: var(--vermelho);
        margin-bottom: 24px;
        font-size: 1.6rem;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-top: 20px;
      }

      label {
        font-weight: 500;
        margin-bottom: 4px;
      }

      input {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.2s;
      }

      input:focus {
        border-color: var(--vermelho);
        outline: none;
      }

      button {
        background: var(--vermelho);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background: var(--vermelho-claro);
      }

      #mensagem {
        margin-top: 15px;
        text-align: center;
        color: var(--vermelho);
        font-weight: 500;
      }

      @media screen and (max-width: 480px) {
        .container {
          padding: 24px;
        }
        .voltar-btn {
          top: 15px;
          left: 15px;
        }
        h1 {
          font-size: 1.4rem;
        }
        input,
        button {
          font-size: 0.9rem;
        }
        button {
          padding: 10px;
        }
        #mensagem {
          font-size: 0.9rem;
        }
      }
      @media screen and (max-width: 360px) {
        .container {
          padding: 20px;
        }
        .voltar-btn {
          top: 10px;
          left: 10px;
        }
        h1 {
          font-size: 1.2rem;
        }
        input,
        button {
          font-size: 0.85rem;
        }
        button {
          padding: 8px;
        }
        #mensagem {
          font-size: 0.85rem;
        }
      }
      @media screen and (max-width: 320px) {
        .container {
          padding: 16px;
        }
        .voltar-btn {
          top: 5px;
          left: 5px;
        }
        h1 {
          font-size: 1rem;
        }
        input,
        button {
          font-size: 0.8rem;
        }
        button {
          padding: 6px;
        }
        #mensagem {
          font-size: 0.8rem;
        }
      }
      @media screen and (max-width: 280px) {
        .container {
          padding: 12px;
        }
        .voltar-btn {
          top: 0;
          left: 0;
        }
        h1 {
          font-size: 0.9rem;
        }
        input,
        button {
          font-size: 0.75rem;
        }
        button {
          padding: 4px;
        }
        #mensagem {
          font-size: 0.75rem;
        }
      }
      @media screen and (max-width: 240px) {
        .container {
          padding: 8px;
        }
        .voltar-btn {
          top: -5px;
          left: -5px;
        }
        h1 {
          font-size: 0.8rem;
        }
        input,
        button {
          font-size: 0.7rem;
        }
        button {
          padding: 2px;
        }
        #mensagem {
          font-size: 0.7rem;
        }
      }
      @media screen and (max-width: 200px) {
        .container {
          padding: 4px;
        }
        .voltar-btn {
          top: -10px;
          left: -10px;
        }
        h1 {
          font-size: 0.7rem;
        }
        input,
        button {
          font-size: 0.65rem;
        }
        button {
          padding: 0;
        }
        #mensagem {
          font-size: 0.65rem;
        }
      }
      @media screen and (max-width: 160px) {
        .container {
          padding: 2px;
        }
        .voltar-btn {
          top: -15px;
          left: -15px;
        }
        h1 {
          font-size: 0.6rem;
        }
        input,
        button {
          font-size: 0.6rem;
        }
        button {
          padding: 0;
        }
        #mensagem {
          font-size: 0.6rem;
        }
      }
      @media screen and (max-width: 1080px) {
        .container {
          padding: 24px;
        }
        .voltar-btn {
          top: 20px;
          left: 20px;
        }
        h1 {
          font-size: 1.4rem;
        }
        input,
        button {
          font-size: 0.9rem;
        }
        button {
          padding: 10px;
        }
        #mensagem {
          font-size: 0.9rem;
        }
      }
      @media screen and (max-width: 800px) {
        .container {
          padding: 20px;
        }
        .voltar-btn {
          top: 15px;
          left: 15px;
        }
        h1 {
          font-size: 1.2rem;
        }
        input,
        button {
          font-size: 0.85rem;
        }
        button {
          padding: 8px;
        }
        #mensagem {
          font-size: 0.85rem;
        }
      }
      @media screen and (max-width: 600px) {
        .container {
          padding: 16px;
        }
        .voltar-btn {
          top: 10px;
          left: 10px;
        }
        h1 {
          font-size: 1rem;
        }
        input,
        button {
          font-size: 0.8rem;
        }
        button {
          padding: 6px;
        }
        #mensagem {
          font-size: 0.8rem;
        }
      }
      @media screen and (max-width: 480px) {
        .container {
          padding: 12px;
        }
        .voltar-btn {
          top: 5px;
          left: 5px;
        }
        h1 {
          font-size: 0.9rem;
        }
        input,
        button {
          font-size: 0.75rem;
        }
        button {
          padding: 4px;
        }
        #mensagem {
          font-size: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <a href="home.html" class="voltar-btn" title="Voltar"
        ><i class="fas fa-arrow-left"></i
      ></a>
      <h1>Editar Contato</h1>
      <form id="form-contato">
        <div class="campo">
          <label for="email">Email:</label>
          <input type="email" id="email" required />
        </div>
        <div class="campo">
          <label for="telefone">Telefone:</label>
          <input type="tel" id="telefone" required />
        </div>
        <button type="submit">Salvar</button>
      </form>
      <p id="mensagem"></p>
    </main>
    <script src="public/home.js?v=2.0.1"></script>
  </body>
</html>
