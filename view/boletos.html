    <style>
      :root {
        --vermelho: #b71c1c;
        --vermelho-claro: #e53935;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(to right, #f3f6fb, #e6edf5);
      }

      header {
        background-color: white;
        border-bottom: 1px solid #ddd;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .voltar {
        font-size: 1.4rem;
        color: var(--vermelho);
        text-decoration: none;
      }

      .voltar:hover {
        color: var(--vermelho-claro);
      }

      .logo {
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--vermelho);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 25px;
        text-align: center;
        color: #b71c1c;
      }

      ul {
        list-style: none;
        padding: 0;
      }

      li.boleto {
        background: #ffffff;
        margin-bottom: 15px;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
      }

      .info {
        flex: 1;
      }

      .info p {
        margin-bottom: 6px;
        font-size: 1rem;
      }

      .info p strong {
        color: #007bff;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-left: 20px;
      }

      .btn-pagar {
        background: #28a745;
        color: white;
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.95rem;
        transition: background 0.2s;
      }

      .btn-pagar:hover {
        background: #218838;
      }

      #mensagem-boletos {
        display: none;
        margin-top: 40px;
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeeba;
        padding: 16px;
        border-radius: 8px;
        font-size: 1.1rem;
        text-align: center;
      }

      .payment-box {
        display: none;
        margin-top: 15px;
        background: #f4f8ff;
        padding: 15px;
        border-left: 4px solid #007bff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }

      .payment-box.active {
        display: block;
      }

      .payment-box p {
        margin-bottom: 10px;
        font-size: 0.95rem;
      }

     .pix-section {
  border: 1px solid #0a74da;
  border-radius: 8px;
  padding: 15px;
  margin-top: 10px;
  background-color: #f9fbff;
  max-width: 350px;
}

.pix-section img {
  display: block;
  margin: 0 auto 15px;
  max-width: 100%;
  height: auto;
  border-radius: 6px;
  box-shadow: 0 0 8px rgba(0,0,0,0.1);
}

.pix-section p {
  font-size: 14px;
  color: #333;
  margin-bottom: 10px;
  word-break: break-word; /* evita estourar o layout com texto grande */
}

.pix-section strong {
  display: block;
  margin-bottom: 5px;
  color: #0a74da;
}

.pix-section button {
  background-color: #0a74da;
  color: white;
  border: none;
  border-radius: 5px;
  padding: 7px 12px;
  cursor: pointer;
  font-size: 14px;
  transition: background-color 0.3s ease;
}

.pix-section button:hover {
  background-color: #084c8d;
}
      .pix-key {
        font-family: monospace;
        background: #f0f4ff;
        padding: 10px;
        border-radius: 6px;
        display: inline-block;
        margin-bottom: 12px;
        word-break: break-all; /* evita estourar o layout com chave longa */
      }
      .btn-close {
        background: transparent;
        border: none;
        color: #888;
        float: right;
        cursor: pointer;
      }
