<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cobranças Pendentes</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="icon" href="public/img/icon-192.png" type="image/png" />
    <link rel="manifest" href="manifest.json" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      :root {
        --vermelho: #b71c1c;
        --vermelho-claro: #e53935;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(to right, #f3f6fb, #e6edf5);
      }

      header {
        background-color: white;
        border-bottom: 1px solid #ddd;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .voltar {
        font-size: 1.4rem;
        color: var(--vermelho);
        text-decoration: none;
      }

      .voltar:hover {
        color: var(--vermelho-claro);
      }

      .logo {
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--vermelho);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 25px;
        text-align: center;
        color: #b71c1c;
      }

      ul {
        list-style: none;
        padding: 0;
      }

      li.boleto {
        background: #ffffff;
        margin-bottom: 15px;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
      }

      .info {
        flex: 1;
      }

      .info p {
        margin-bottom: 6px;
        font-size: 1rem;
      }

      .info p strong {
        color: #007bff;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-left: 20px;
      }

      .btn-pagar {
        background: #28a745;
        color: white;
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.95rem;
        transition: background 0.2s;
      }

      .btn-pagar:hover {
        background: #218838;
      }

      #mensagem-boletos {
        display: none;
        margin-top: 40px;
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeeba;
        padding: 16px;
        border-radius: 8px;
        font-size: 1.1rem;
        text-align: center;
      }

      .payment-box {
        display: none;
        margin-top: 15px;
        background: #f4f8ff;
        padding: 15px;
        border-left: 4px solid #007bff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }

      .payment-box.active {
        display: block;
      }

      .payment-box p {
        margin-bottom: 10px;
        font-size: 0.95rem;
      }

      .pix-section img {
        width: 140px;
        height: 140px;
        border-radius: 8px;
        margin-bottom: 8px;
      }

      .pix-key {
        font-family: monospace;
        background: #fff;
        padding: 8px;
        border-radius: 6px;
        display: inline-block;
        margin-bottom: 12px;
      }

      .btn-close {
        background: transparent;
        border: none;
        color: #888;
        float: right;
        cursor: pointer;
      }

      @media screen and (max-width: 600px) {
        .actions {
          width: 100%;
          margin-top: 10px;
          margin-left: 0;
        }

        li.boleto {
          flex-direction: column;
          align-items: flex-start;
        }

        .btn-pagar {
          width: 100%;
          text-align: center;
        }

        header {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }

        .logo {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="home.html" class="voltar" title="Voltar">
        <i class="fas fa-arrow-left"></i>
      </a>
      <div class="logo">
        <i class="fas fa-file-invoice"></i> Primeiros Passos Digital
      </div>
    </header>
    
    <main class="container">
      <h1>Cobranças Pendentes</h1>
      <ul id="lista-boletos"></ul>
      <p id="mensagem-boletos" style="display: none">
        Você não tem cobranças pendentes.
      </p>
    </main>

    <script src="public/boletos.js?v=2.0.1"></script>
  </body>
</html>
