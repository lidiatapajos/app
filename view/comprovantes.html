<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Comprovantes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --vermelho: #d32f2f;
      --vermelho-claro: #e57373;
      --cinza-bg: #f8f9fa;
      --cinza-card: #fff;
      --cinza-texto: #333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--cinza-bg);
      color: var(--cinza-texto);
      min-height: 100vh;
    }

    header {
      background-color: white;
      border-bottom: 1px solid #ddd;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--vermelho);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .voltar {
      font-size: 1.2rem;
      color: var(--vermelho);
      text-decoration: none;
    }

    .voltar:hover {
      color: var(--vermelho-claro);
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--vermelho);
      text-align: center;
      margin-bottom: 30px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li.comprovante {
      background: var(--cinza-card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      border-left: 4px solid var(--vermelho);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.2s;
    }

    li.comprovante:hover {
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
    }

    .info p {
      margin: 4px 0;
    }

    .info p strong {
      color: var(--vermelho);
    }

    .actions button {
      background: var(--vermelho);
      border: none;
      color: white;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .actions button:hover {
      background: var(--vermelho-claro);
    }

    @media (max-width: 600px) {
      li.comprovante {
        flex-direction: column;
        align-items: flex-start;
      }

      .actions {
        width: 100%;
        margin-top: 10px;
        text-align: right;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="home.html" class="voltar" title="Voltar">
        <i class="fas fa-arrow-left"></i>
      </a>
      <div class="logo">
        <i class="fas fa-file-alt"></i> Comprovantes
      </div>
    </div>
  </header>

  <main class="container">
    <h1>Comprovantes de Pagamento</h1>
    <ul id="comprovantes-lista"></ul>
    <p id="mensagem" style="text-align: center; color: gray;"></p>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const lista = document.getElementById("comprovantes-lista");
      const mensagem = document.getElementById("mensagem");

      // ⚠️ Aqui é onde você simula o CPF do usuário logado
      // Quando tiver login real, substitua por: const cpf = usuarioLogado.cpf;
      const cpf = localStorage.getItem("cpfLogado");

      if (!cpf) {
        mensagem.textContent = "Nenhum usuário logado.";
        return;
      }

      try {
        const res = await fetch(`https://primeiros-passos-digital.onrender.com/comprovantes?cpf=${cpf}`);
        if (!res.ok) throw new Error("Erro ao buscar comprovantes");

        const comprovantes = await res.json();

        if (comprovantes.length === 0) {
          mensagem.textContent = "Nenhum pagamento realizado ainda.";
          return;
        }

        comprovantes.forEach(comp => {
          const li = document.createElement("li");
          li.className = "comprovante";

          const info = document.createElement("div");
          info.className = "info";
          info.innerHTML = `
            <p><strong>${comp.descricao}</strong></p>
            <p>Pago em: ${formatarData(comp.data_pagamento)}</p>
            <p>Valor: R$ ${parseFloat(comp.valor).toFixed(2)}</p>
          `;

          const actions = document.createElement("div");
          actions.className = "actions";
          const btn = document.createElement("button");
          btn.innerHTML = '<i class="fas fa-download"></i> PDF';
          btn.onclick = () => gerarComprovantePDF(comp);
          actions.appendChild(btn);

          li.appendChild(info);
          li.appendChild(actions);
          lista.appendChild(li);
        });

      } catch (err) {
        console.error(err);
        mensagem.textContent = "Erro ao carregar comprovantes.";
      }
    });

    function formatarData(data) {
      if (!data) return "";
      const d = new Date(data);
      return d.toLocaleDateString("pt-BR");
    }

    function gerarComprovantePDF(comp) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(18);
      doc.text("Comprovante de Pagamento", 20, 20);

      doc.setFontSize(12);
      doc.text(`Descrição: ${comp.descricao}`, 20, 40);
      doc.text(`Valor: R$ ${parseFloat(comp.valor).toFixed(2)}`, 20, 50);
      doc.text(`Data de pagamento: ${formatarData(comp.data_pagamento)}`, 20, 60);
      doc.text("Este comprovante confirma que o pagamento foi realizado com sucesso.", 20, 80, { maxWidth: 170 });

      doc.save(`comprovante_${comp.descricao}.pdf`);
    }
  </script>

</body>
</html>
