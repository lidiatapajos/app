<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de cliente</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="public/css/adm.css?v=2.0.1" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="public/img/icon-512.png" type="image/png" />
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #555;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="tel"] {
        width: 100%;
        padding: 8px 10px;
        margin-bottom: 18px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        transition: border-color 0.3s ease;
      }
      input[type="text"]:focus,
      input[type="email"]:focus,
      input[type="password"]:focus,
      input[type="tel"]:focus {
        border-color: #007bff;
        outline: none;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #007bff;
        border: none;
        border-radius: 4px;
        color: white;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      button:hover {
        background-color: #0056b3;
      }
      .form-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .form-container form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .form-container h2 {
        margin-bottom: 20px;
        font-size: 1.5em;
      }

      .form-container input {
        margin: 0;
      }

      .form-container button {
        margin-top: 10px;
      }

      /* 1. Celular muito pequeno (tipo iPhone SE em pé) */
      @media (max-width: 320px) {
        .form-container {
          padding: 15px;
        }

        h2 {
          font-size: 1.2em;
        }

        input,
        button {
          font-size: 0.85em;
        }
      }

      /* 2. Celular pequeno (até 375px) */
      @media (max-width: 375px) {
        .form-container {
          padding: 18px;
        }

        h2 {
          font-size: 1.3em;
        }

        input,
        button {
          font-size: 0.9em;
        }
      }

      /* 3. Celular padrão (tipo iPhone 14, Galaxy S) */
      @media (max-width: 425px) {
        .form-container {
          padding: 20px;
        }

        h2 {
          font-size: 1.4em;
        }

        button {
          font-size: 1em;
        }
      }

      /* 4. Celular grande / Phablet (tipo iPhone Pro Max, Galaxy Note) */
      @media (max-width: 480px) {
        .form-container {
          padding: 22px;
        }

        h2 {
          font-size: 1.5em;
        }
      }

      /* 5. Tablet retrato (tipo iPad em pé) */
      @media (max-width: 768px) {
        .form-container {
          max-width: 90%;
          padding: 25px;
        }

        h2 {
          font-size: 1.6em;
        }
      }

      /* 6. Tablet paisagem ou notebook pequeno */
      @media (max-width: 1024px) {
        .form-container {
          max-width: 400px;
        }
      }

      /* 7. Desktop padrão (entre 1025px e 1440px) */
      @media (min-width: 1025px) and (max-width: 1440px) {
        .form-container {
          max-width: 400px;
        }
      }

      /* 8. Telas grandes (monitores ultra wide ou TVs) */
      @media (min-width: 1441px) {
        .form-container {
          max-width: 450px;
          padding: 40px;
        }

        h2 {
          font-size: 2em;
        }

        input,
        button {
          font-size: 1.1em;
        }
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h2>Cadastro de Usuário</h2>
      <form id="cadastroForm">
        <label for="nome">Nome completo</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Seu nome"
          required
        />

        <label for="cpf">CPF</label>
        <input
          type="text"
          id="cpf"
          name="cpf"
          placeholder="000.000.000-00"
          maxlength="11"
          required
        />

        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="exemplo@site.com"
          required
        />

        <label for="telefone">Telefone</label>
        <input
          type="tel"
          id="telefone"
          name="telefone"
          placeholder="(xx) xxxx-xxxx"
        />

        <label for="nomeFilho">Nome do Filho</label>
        <input
          type="text"
          id="nomeFilho"
          name="nomeFilho"
          placeholder="Nome do aluno"
        />
        <button type="submit">Cadastrar</button>
      </form>
    </div>
    <script src="public/adm.js?v=2.0.1"></script>
  </body>
</html>
