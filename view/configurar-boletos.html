<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Configurar Boletos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="public/css/configurar-boletos.css" />
  <link rel="icon" href="public/img/icon-512.png" type="image/png" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <img src="public/img/icon-192.png" alt="Logo da escola" />
    </div>
    <button class="logout-btn" onclick="window.location.href='adm.html'">Voltar</button>
  </header>

  <main class="config-container">
    <h1>Configurar Geração Automática de Boletos</h1>
    <form id="config-form">
      <label for="dia-liberacao">Dia de Liberação:</label>
      <input type="number" id="diaLiberacao" min="1" max="28" required />

      <label for="dia-vencimento">Dia de Vencimento:</label>
      <input type="number" id="diaVencimento" min="1" max="31" required />
      <label for="valor">Valor Padrão:</label>
      <input type="number" id="valorPadrao" step="0.01" required />


      <button type="submit">Salvar Configuração</button>
    </form>
  </main>
  <script src="public/configurar-boletos.js"></script>
</body>
</html>
